<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E151C">
<title>DailyFuel</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: app de una pantalla, contenido arriba y navegación fija abajo (pulgar en Android) */
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --ink:#13202B; --muted:#5B6976; --line:#D9E1E8;
  --accent:#D97A06; --accent-ink:#FFFFFF; --soft:#FCEBD3;
  --good:#18916A; --good-soft:#D6F1E6; --bad:#CC3F37; --bad-soft:#F8DDDB; --idle:#E3E8ED;
  --display:"Bricolage Grotesque", "Segoe UI", Roboto, sans-serif;
  --body:"Manrope", "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151C; --surface:#17212B; --ink:#E7EDF2; --muted:#93A2AF; --line:#26333F;
    --accent:#F2A229; --accent-ink:#1A1205; --soft:#3A2A12;
    --good:#3CC48F; --good-soft:#123A2C; --bad:#F06A60; --bad-soft:#3F1C1A; --idle:#212D38;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#17212B; --ink:#E7EDF2; --muted:#93A2AF; --line:#26333F;
  --accent:#F2A229; --accent-ink:#1A1205; --soft:#3A2A12;
  --good:#3CC48F; --good-soft:#123A2C; --bad:#F06A60; --bad-soft:#3F1C1A; --idle:#212D38;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 4px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand span{color:var(--accent)}
main{flex:1;padding:8px 16px 104px;display:flex;flex-direction:column;gap:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav.tabs .inner{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:560px}
nav.tabs button{background:none;border:0;padding:8px 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datebar .label{font-weight:700;text-align:center;flex:1}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn svg{width:20px;height:20px}
.hero{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-family:var(--display);font-weight:800;font-size:32px;letter-spacing:-.02em}
.stats{display:flex;flex-direction:column;gap:8px}
.stat .k{font-size:13px;color:var(--muted)}
.stat .v{font-weight:700;font-size:20px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700;width:max-content}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.idle{background:var(--idle);color:var(--muted)}
.pill.prog{background:var(--soft);color:var(--accent)}
.meal h3{font-size:16px;display:flex;justify-content:space-between;align-items:baseline}
.meal h3 .num{font-family:var(--body);font-size:14px;color:var(--muted);font-weight:600}
.list{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .grow{flex:1;min-width:0}
.list .name{font-weight:600;overflow-wrap:anywhere}
.list .kc{font-weight:700;white-space:nowrap}
.del{background:none;border:0;color:var(--muted);width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.del:hover{background:var(--idle)}
.del svg{width:18px;height:18px}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad);color:#fff}
.btn.block{width:100%}
.fab{position:fixed;right:max(16px, calc(50% - 264px));bottom:calc(84px + env(safe-area-inset-bottom));z-index:6;border-radius:18px;padding:15px 20px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.fab svg{width:20px;height:20px}
.fab[hidden]{display:none}
.empty{color:var(--muted);text-align:center;padding:18px 8px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--idle);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:9px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
input[type=text],input[type=number],input[type=search],select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--ink)}
textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:16px;resize:vertical;font:inherit}
.preview{display:block;width:100%;max-height:220px;object-fit:cover;border-radius:14px;border:1px solid var(--line)}
.irow{border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.irow input,.irow select{padding:9px 10px;background:var(--surface)}
.irow-q{display:grid;grid-template-columns:1fr 92px 1fr auto;gap:8px;align-items:center}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.03em;padding:2px 7px;border-radius:6px;background:var(--soft);color:var(--accent);vertical-align:1px}
.btn:disabled{opacity:.6;cursor:progress}
.calc{background:var(--soft);border-radius:12px;padding:12px 14px;font-weight:700;display:flex;justify-content:space-between}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,10,15,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto}
.sheet h2{font-size:22px}
.plist{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto}
.plist button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;gap:8px}
.plist button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
/* summary */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile .v{font-family:var(--display);font-weight:800;font-size:24px}
.tile .k{font-size:12px;color:var(--muted);font-weight:600}
.chart{width:100%;overflow-x:auto}
.chart svg{width:100%;height:auto;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{font-size:12px;text-align:center;color:var(--muted);font-weight:700}
.cal .d{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--idle);color:var(--muted);border:0;padding:0}
.cal .d small{font-size:9px;font-weight:600;opacity:.85}
.cal .d.met{background:var(--good-soft);color:var(--good)}
.cal .d.miss{background:var(--bad-soft);color:var(--bad)}
.cal .d.today{outline:2px solid var(--accent);outline-offset:-2px;color:var(--ink)}
.cal .d.future{opacity:.4}
.cal .blank{background:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.banner{background:var(--bad-soft);color:var(--bad);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;max-width:90%}
.stack{display:flex;flex-direction:column;gap:12px}
.hint{font-size:13px;color:var(--muted)}
@media (max-width:380px){.hero{grid-template-columns:1fr;justify-items:center}.stats{width:100%}}
@media (prefers-reduced-motion:no-preference){.ring circle.prog{transition:stroke-dashoffset .5s ease}.sheet{animation:up .22s ease}}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Daily<span>Fuel</span></div>
    <div class="small muted" id="hdrGoal"></div>
  </header>
  <main id="view" aria-live="polite"></main>
</div>
<button class="btn fab" id="fab" aria-label="Agregar comida">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  Agregar
</button>
<nav class="tabs" aria-label="Secciones"><div class="inner">
  <button data-view="hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Hoy</button>
  <button data-view="productos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8l8-4 8 4-8 4-8-4z"/><path d="M4 8v8l8 4 8-4V8"/><path d="M12 12v8"/></svg>Productos</button>
  <button data-view="resumen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Resumen</button>
  <button data-view="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
</div></nav>

<script>
"use strict";
/* ---------- Datos ---------- */
const KEY = "dailyfuel.v1";
const MEALS = [["desayuno","Desayuno"],["almuerzo","Almuerzo"],["once","Once"],["cena","Cena"],["colacion","Colación"]];
const MEAL_NAME = Object.fromEntries(MEALS);
const BASIS = {g:"por 100 g", ml:"por 100 ml", porcion:"por porción"};
let storageOK = true;

function blank(){ return {v:1, goals:[], entries:[], products:[], dishes:[]}; }
function load(){
  try{ const s = localStorage.getItem(KEY); if(s){ const d = JSON.parse(s); if(d && Array.isArray(d.entries)) return d; } }
  catch(e){ storageOK = false; }
  return null;
}
let S = load() || blank();
if(!Array.isArray(S.dishes)) S.dishes = [];
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; }
  catch(e){ storageOK = false; }
}

/* ---------- Fechas ---------- */
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const todayISO = () => iso(new Date());
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtLong = s => parse(s).toLocaleDateString("es-CL",{weekday:"long", day:"numeric", month:"long"});
const fmtShort = s => parse(s).toLocaleDateString("es-CL",{day:"numeric", month:"short"});
const monthName = s => parse(s).toLocaleDateString("es-CL",{month:"long", year:"numeric"});
const weekStart = s => { const d = parse(s); const off = (d.getDay()+6)%7; d.setDate(d.getDate()-off); return iso(d); };
const n0 = v => Math.round(v).toLocaleString("es-CL");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- Meta y cumplimiento ---------- */
// La meta se guarda con fecha de inicio: cambiarla no reescribe el historial.
function goalFor(date){
  if(!S.goals.length) return null;
  const sorted = [...S.goals].sort((a,b)=>a.from.localeCompare(b.from));
  let g = sorted[0];
  for(const x of sorted){ if(x.from <= date) g = x; }
  return g;
}
function setGoal(kcal, mode, tol){
  const from = todayISO();
  S.goals = S.goals.filter(g => g.from !== from);
  S.goals.push({from, kcal, mode, tol});
  save();
}
const dayEntries = d => S.entries.filter(e => e.date === d);
const dayTotal = d => dayEntries(d).reduce((a,e)=>a+e.kcal, 0);
function isMet(total, g){
  if(g.mode === "min") return total >= g.kcal*(1 - g.tol/100);
  return total <= g.kcal*(1 + g.tol/100);
}
// empty | future | today | met | miss | nogoal
function statusOf(d){
  const t = todayISO();
  if(d > t) return "future";
  const total = dayTotal(d);
  if(!dayEntries(d).length) return d === t ? "today" : "empty";
  if(d === t) return "today";
  const g = goalFor(d);
  if(!g) return "nogoal";
  return isMet(total, g) ? "met" : "miss";
}

/* ---------- Estado de UI ---------- */
const UI = { view:"hoy", day: todayISO(), sumMode:"semana", sumAnchor: todayISO() };
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if(UI.view==="ajustes") render(); });

const $ = (s, r=document) => r.querySelector(s);
const view = $("#view");
const ICON = {
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>'
};

function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2200);
}

/* ---------- Hoja inferior (modal) ---------- */
function openSheet(html, mount){
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  const close = () => { scrim.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if(e.key === "Escape") close(); };
  scrim.addEventListener("click", e => { if(e.target === scrim) close(); });
  document.addEventListener("keydown", onKey);
  document.body.appendChild(scrim);
  mount && mount(scrim.querySelector(".sheet"), close);
  const first = scrim.querySelector("input,select,button.btn");
  if(first) setTimeout(()=>first.focus(), 60);
}
function confirmSheet(title, text, okLabel, onOk, danger=true){
  openSheet(`<h2>${esc(title)}</h2><p class="muted" style="margin:0">${esc(text)}</p>
    <div class="grid2"><button class="btn ghost" data-x>Cancelar</button><button class="btn ${danger?"danger":""}" data-ok>${esc(okLabel)}</button></div>`,
  (el, close) => { el.querySelector("[data-x]").onclick = close; el.querySelector("[data-ok]").onclick = () => { close(); onOk(); }; });
}

/* ---------- Configuración inicial / meta ---------- */
function goalSheet(first=false){
  const g = goalFor(todayISO()) || {kcal:"", mode:"max", tol:5};
  openSheet(`
    <h2>${first ? "Define tu meta diaria" : "Cambiar meta diaria"}</h2>
    ${first ? '<p class="muted" style="margin:0">Ingresa las calorías que quieres para cada día. Puedes cambiarla cuando quieras en Ajustes.</p>' : '<p class="hint" style="margin:0">El cambio rige desde hoy. Los días anteriores se siguen evaluando con la meta que tenían.</p>'}
    <form class="stack" id="gf">
      <label class="f" for="gKcal">Meta diaria (kcal)
        <input id="gKcal" type="number" inputmode="numeric" min="300" max="10000" step="10" required value="${g.kcal}" placeholder="Ej: 2000"></label>
      <div class="stack" style="gap:6px">
        <span style="font-weight:600;font-size:14px">¿Cuándo cuenta como día cumplido?</span>
        <div class="seg" role="group" aria-label="Tipo de meta">
          <button type="button" data-mode="max" aria-pressed="${g.mode==="max"}">No pasarme</button>
          <button type="button" data-mode="min" aria-pressed="${g.mode==="min"}">Llegar al mínimo</button>
        </div>
      </div>
      <label class="f" for="gTol">Margen de tolerancia (%)
        <input id="gTol" type="number" inputmode="numeric" min="0" max="30" step="1" value="${g.tol}"></label>
      <p class="hint" id="gHelp" style="margin:0"></p>
      <button class="btn block" type="submit">Guardar meta</button>
    </form>`,
  (el, close) => {
    let mode = g.mode;
    const help = () => {
      const k = +el.querySelector("#gKcal").value || 0, t = +el.querySelector("#gTol").value || 0;
      if(!k){ el.querySelector("#gHelp").textContent = ""; return; }
      el.querySelector("#gHelp").textContent = mode === "max"
        ? `Cumples el día si comes hasta ${n0(k*(1+t/100))} kcal.`
        : `Cumples el día si llegas al menos a ${n0(k*(1-t/100))} kcal.`;
    };
    el.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => {
      mode = b.dataset.mode;
      el.querySelectorAll("[data-mode]").forEach(x => x.setAttribute("aria-pressed", x === b));
      help();
    });

// La clave vive solo en este teléfono (localStorage) y NO va en los respaldos ni en el código.
const AIKEY = "dailyfuel.gemini", AIMODEL = "dailyfuel.gemini.model", DEFAULT_MODEL = "gemini-flash-latest";
const API = "https://generativelanguage.googleapis.com/v1beta";
const getKey = () => { try{ return localStorage.getItem(AIKEY) || ""; }catch(e){ return ""; } };
const setKey = k => { try{ k ? localStorage.setItem(AIKEY, k) : localStorage.removeItem(AIKEY); }catch(e){} };
const getModel = () => { try{ return localStorage.getItem(AIMODEL) || DEFAULT_MODEL; }catch(e){ return DEFAULT_MODEL; } };
const setModel = m => { try{ localStorage.setItem(AIMODEL, m); }catch(e){} };
class AIError extends Error{ constructor(m, auth=false){ super(m); this.auth = auth; } }

async function aiHttpError(r){
  let msg = ""; try{ const j = await r.json(); msg = (j.error && j.error.message) || ""; }catch(e){}
  if(r.status === 429) return new AIError("Llegaste al límite gratuito por ahora. Espera un minuto y vuelve a intentar.");
  if(r.status === 400 && /api key/i.test(msg)) return new AIError("La clave de Gemini no es válida. Revísala en Ajustes.", true);
  if(r.status === 403) return new AIError("Google rechazó la clave. Revísala en Ajustes.", true);
  if(r.status === 503 || r.status === 500) return new AIError("Gemini está saturado en este momento. Intenta de nuevo en unos minutos.");
  return new AIError(`Gemini respondió con un error (${r.status}). ${msg.slice(0,140)}`);
}
// Si el modelo por defecto no existe para la clave, elige el mejor "Flash" disponible.
async function pickModel(key){
  const r = await fetch(`${API}/models?pageSize=200&key=${encodeURIComponent(key)}`);
  if(!r.ok) throw await aiHttpError(r);
  const j = await r.json();
  const list = (j.models || []).map(m => ({id: m.name.replace(/^models\//,""), m}))
    .filter(x => (x.m.supportedGenerationMethods || []).includes("generateContent") && /flash/i.test(x.id)
      && !/(image|tts|audio|live|embed|robotics|computer)/i.test(x.id));
  const penalty = id => (/lite/i.test(id) ? 2 : 0) + (/preview|exp/i.test(id) ? 1 : 0);
  list.sort((a,b) => penalty(a.id) - penalty(b.id) || b.id.localeCompare(a.id, undefined, {numeric:true}));
  return list.map(x => x.id);
}
async function geminiJSON(parts, sys){
  const key = getKey();
  if(!key) throw new AIError("Primero agrega tu clave de Gemini en Ajustes.");
  const body = JSON.stringify({ systemInstruction:{parts:[{text:sys}]}, contents:[{role:"user", parts}],
    generationConfig:{ responseMimeType:"application/json", temperature:0.2 } });
  const call = m => fetch(`${API}/models/${m}:generateContent?key=${encodeURIComponent(key)}`,
    {method:"POST", headers:{"Content-Type":"application/json"}, body});
  const wait = ms => new Promise(res => setTimeout(res, ms));
  const attempt = async m => { try{ return await call(m); }catch(e){ throw new AIError("Sin conexión. La IA necesita internet."); } };
  let model = getModel(), r = await attempt(model);
  if(r.status === 503 || r.status === 500){ await wait(1500); r = await attempt(model); }
  // Modelo inexistente o saturado: probar otros modelos Flash disponibles para la clave
  if(r.status === 404 || r.status === 503 || r.status === 500){
    let others = [];
    try{ others = (await pickModel(key)).filter(m => m !== model); }catch(e){ if(r.status === 404) throw e; }
    for(const m of others.slice(0, 4)){
      const r2 = await attempt(m);
      if(r2.ok){ setModel(m); r = r2; break; }
      if(r2.status === 400 || r2.status === 403){ r = r2; break; }
      r = r2;
    }
    if(r.status === 404) throw new AIError("No encontré un modelo Gemini disponible para tu clave.");
  }
  if(!r.ok) throw await aiHttpError(r);
  const j = await r.json();
  const list = (j.models || []).map(m => ({id: m.name.replace(/^models\//,""), m}))
    .filter(x => (x.m.supportedGenerationMethods || []).includes("generateContent") && /flash/i.test(x.id)
      && !/(image|tts|audio|live|embed|robotics|computer)/i.test(x.id));
  const penalty = id => (/lite/i.test(id) ? 2 : 0) + (/preview|exp/i.test(id) ? 1 : 0);
  list.sort((a,b) => penalty(a.id) - penalty(b.id) || b.id.localeCompare(a.id, undefined, {numeric:true}));
  return list.map(x => x.id);
}
async function geminiJSON(parts, sys){
  const key = getKey();
  if(!key) throw new AIError("Primero agrega tu clave de Gemini en Ajustes.");
  const body = JSON.stringify({ systemInstruction:{parts:[{text:sys}]}, contents:[{role:"user", parts}],
    generationConfig:{ responseMimeType:"application/json", temperature:0.2 } });
  const call = m => fetch(`${API}/models/${m}:generateContent?key=${encodeURIComponent(key)}`,
    {method:"POST", headers:{"Content-Type":"application/json"}, body});
  let r;
  try{ r = await call(getModel()); }catch(e){ throw new AIError("Sin conexión. La IA necesita internet."); }
  if(r.status === 404){
    const m = await pickModel(key);
    if(!m) throw new AIError("No encontré un modelo Gemini disponible para tu clave.");
    setModel(m); r = await call(m);
  }
  if(!r.ok) throw await aiHttpError(r);
  const j = await r.json();
  const parts0 = (((j.candidates || [])[0] || {}).content || {}).parts || [];
  const txt = parts0.map(p => p.text || "").join("").trim();
  if(!txt) throw new AIError("Gemini no devolvió respuesta. Prueba con otra foto o agrega una descripción.");
  try{ return JSON.parse(txt.replace(/^```(?:json)?\s*/,"").replace(/\s*```$/,"")); }
  catch(e){ throw new AIError("No pude leer la respuesta de Gemini. Intenta de nuevo."); }
}

const SYS_FOOD = `Eres un nutricionista que estima calorías de comidas para una persona que vive en Chile.
Recibirás una foto de comida y/o una descripción del usuario, y a veces productos del usuario con sus calorías exactas.
Reglas:
- Separa la comida en sus ingredientes principales (máximo 10).
- Incluye aceite, mantequilla, azúcar, salsas o aderezos probables aunque no se vean, y menciónalo en la nota.
- Lo que el usuario diga (marca, tipo, cantidad) manda por sobre lo que ves en la foto.
- Si un ingrediente corresponde a un producto del usuario, pon su id en "producto_id" y calcula sus kcal con LOS VALORES DEL USUARIO.
- Si no hay referencia de tamaño, usa porciones típicas chilenas.
- Usa nombres en español de Chile (palta, marraqueta, porotos, quesillo).
- Si la imagen no es comida, devuelve "items" vacío y explícalo en la nota.
Responde SOLO con JSON con esta forma exacta:
{"plato": string, "items": [{"nombre": string, "cantidad": number, "unidad": "g" | "ml" | "unidad", "kcal": number, "producto_id": string | null}], "confianza": "alta" | "media" | "baja", "nota": string}
La nota: máximo 2 frases, en español, diciendo qué supusiste.`;

function resizeImage(file, max = 1024){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new AIError("No pude abrir esa imagen.")); };
    img.src = url;
  });
}
async function analyzeFood({image, text, productIds}){
  const parts = [];
  if(image) parts.push({inline_data:{mime_type:"image/jpeg", data: image.split(",")[1]}});
  const prods = S.products.filter(p => productIds.includes(p.id));
  let t = text ? `Descripción del usuario: ${text}` : "El usuario no agregó descripción.";
  if(prods.length) t += "\nProductos del usuario que están en esta comida:\n" + prods.map(p =>
    `- id ${p.id}: ${p.name}, ${p.kcal} kcal ${p.basis === "porcion" ? "por " + (p.portion || "porción") : p.basis === "ml" ? "por 100 ml" : "por 100 g"}`).join("\n");
  if(!image) t += "\nNo hay foto: estima solo con la descripción.";
  parts.push({text: t});
  const out = await geminiJSON(parts, SYS_FOOD);
  const items = (Array.isArray(out.items) ? out.items : []).map(i => {
    const it = { nombre: String(i.nombre || "Ingrediente").slice(0,50), cantidad: Math.max(0, +i.cantidad || 0),
      unidad: ["g","ml","unidad"].includes(i.unidad) ? i.unidad : "g", kcal: Math.max(0, Math.round(+i.kcal || 0)), producto_id: i.producto_id || null };
    // Para productos del usuario recalculamos con sus valores exactos
    const p = prods.find(x => x.id === it.producto_id);
    if(p && it.cantidad > 0){
      if(p.basis === "porcion" && it.unidad === "unidad") it.kcal = Math.round(p.kcal * it.cantidad);
      else if(p.basis !== "porcion" && it.unidad !== "unidad") it.kcal = Math.round(p.kcal * it.cantidad / 100);
    }
    return it;
  });
  return { plato: String(out.plato || "Comida").slice(0,60), items, confianza: out.confianza || "media", nota: String(out.nota || "") };
}

      list.innerHTML = items.length ? items.map(p => `<button type="button" data-p="${p.id}" aria-pressed="${!!sel && sel.id===p.id}"><span>${p.isDish ? '<span class="tag">Plato</span> ' : ""}${esc(p.name)}</span><span class="muted small num">${n0(p.kcal)} kcal ${p.isDish ? "por porción" : BASIS[p.basis]}</span></button>`).join("")
        : `<p class="empty">Sin resultados</p>`;
      list.querySelectorAll("[data-p]").forEach(b => b.onclick = () => {
        sel = catalog.find(p => p.id === b.dataset.p);
        el.querySelector("#pQty").hidden = false;
        el.querySelector("#pQLabel").textContent = `Cantidad (${unitOf(sel)})`;
        q.value = sel.basis === "porcion" ? 1 : 100;
        draw(); calc(); q.focus(); q.select();
      });
    };
    el.querySelector("#pSearch").oninput = draw; q.oninput = calc; draw();
    el.querySelector("#fP").onsubmit = e => {
      e.preventDefault();
      if(!sel){ toast("Elige un producto o plato"); return; }
      const qty = +q.value; if(!qty || qty <= 0){ toast("Ingresa la cantidad"); return; }
      const kcal = Math.round(productKcal(sel, qty));
      const entry = {id:uid(), date, time:nowHM(), meal, kcal};
      if(sel.isDish){
        entry.name = qty === 1 ? sel.name : `${sel.name} · ${qty.toLocaleString("es-CL")} porciones`;
        entry.items = (sel.items || []).map(i => ({...i, cantidad: Math.round(i.cantidad*qty*10)/10, kcal: Math.round(i.kcal*qty)}));
        entry.dishId = sel.id;
      } else {
        entry.name = `${sel.name} · ${qty.toLocaleString("es-CL")} ${qtyUnit(sel)}`;
        entry.productId = sel.id; entry.qty = qty;
      }
      S.entries.push(entry); save(); close(); render(); toast(`+${n0(kcal)} kcal`);
    };
  });
}

/* ---------- Vista: Hoy ---------- */
function ringSVG(total, g){
  const r = 62, c = 2*Math.PI*r;
  const ratio = g ? Math.min(total / g.kcal, 1) : 0;
  const over = g && g.mode === "max" && !isMet(total, g);
  const reached = g && g.mode === "min" && isMet(total, g);
  const color = over ? "var(--bad)" : reached ? "var(--good)" : "var(--accent)";
  return `<svg viewBox="0 0 150 150" aria-hidden="true">
    <circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--idle)" stroke-width="14"/>
    <circle class="prog" cx="75" cy="75" r="${r}" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c*(1-ratio)}"/></svg>`;
}
function statusPill(d){
  const st = statusOf(d), g = goalFor(d), total = dayTotal(d);
  if(st === "met") return `<span class="pill good">Día cumplido</span>`;
  if(st === "miss") return `<span class="pill bad">No cumplido</span>`;
  if(st === "empty") return `<span class="pill idle">Sin registro</span>`;
  if(st === "today" && g){
    if(g.mode === "max") return isMet(total,g) ? `<span class="pill prog">En curso · dentro de la meta</span>` : `<span class="pill bad">Te pasaste de la meta</span>`;
    return isMet(total,g) ? `<span class="pill good">Mínimo alcanzado</span>` : `<span class="pill prog">En curso</span>`;
  }
  return "";
}
function renderHoy(){
  const d = UI.day, g = goalFor(d), total = dayTotal(d), entries = dayEntries(d);
  const t = todayISO();
  const remaining = g ? g.kcal - total : null;
  const label = d === t ? "Hoy" : d === addDays(t,-1) ? "Ayer" : fmtShort(d);
  let html = `${!storageOK ? `<div class="banner">Este navegador no está guardando datos. Abre la app instalada para que tu registro se conserve.</div>` : ""}
  <div class="datebar">
    <button class="iconbtn" id="prevD" aria-label="Día anterior">${ICON.left}</button>
    <div class="label"><div>${esc(label)}</div><div class="small muted" style="font-weight:500">${esc(fmtLong(d))}</div></div>
    <button class="iconbtn" id="nextD" aria-label="Día siguiente" ${d >= t ? "disabled" : ""}>${ICON.right}</button>
  </div>
  <section class="card hero">
    <div class="ring">${ringSVG(total, g)}
      <div class="center"><div class="big num">${n0(total)}</div><div class="small muted">de ${g ? n0(g.kcal) : "—"} kcal</div></div>
    </div>
    <div class="stats">
      ${statusPill(d)}
      <div class="stat"><div class="k">${remaining === null ? "Meta" : remaining >= 0 ? (g.mode==="max" ? "Te quedan" : "Te faltan") : "Sobre la meta"}</div>
        <div class="v num">${remaining === null ? "Sin definir" : n0(Math.abs(remaining)) + " kcal"}</div></div>
      <div class="stat"><div class="k">Registros</div><div class="v num">${entries.length}</div></div>
    </div>
  </section>`;
  if(!entries.length){
    html += `<section class="card empty">Todavía no registras comidas ${d === t ? "hoy" : "este día"}. Toca <b>Agregar</b> para sumar calorías.</section>`;
  } else {
    for(const [k, name] of MEALS){
      const items = entries.filter(e => e.meal === k).sort((a,b)=>a.time.localeCompare(b.time));
      if(!items.length) continue;
      html += `<section class="card meal"><h3>${name}<span class="num">${n0(items.reduce((a,e)=>a+e.kcal,0))} kcal</span></h3>
        <ul class="list">${items.map(e => `<li><div class="grow"><div class="name">${e.ai ? '<span class="tag">IA</span> ' : ""}${esc(e.name)}</div>${e.items && e.items.length ? `<div class="small muted">${esc(e.items.map(i => `${i.nombre} ${i.cantidad ? n0(i.cantidad) + " " + i.unidad : ""}`.trim()).join(" · "))}</div>` : ""}<div class="small muted num">${esc(e.time)}</div></div>
        <div class="kc num">${n0(e.kcal)}</div><button class="del" data-del="${e.id}" aria-label="Eliminar ${esc(e.name)}">${ICON.trash}</button></li>`).join("")}</ul></section>`;
    }
  }
  view.innerHTML = html;
  $("#prevD").onclick = () => { UI.day = addDays(UI.day,-1); render(); };
  $("#nextD").onclick = () => { if(UI.day < t){ UI.day = addDays(UI.day,1); render(); } };
  view.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const e = S.entries.find(x => x.id === b.dataset.del);
    confirmSheet("Eliminar registro", `${e.name} · ${n0(e.kcal)} kcal`, "Eliminar", () => {
      S.entries = S.entries.filter(x => x.id !== e.id); save(); render();
    });
  });
}

/* ---------- Vista: Resumen ---------- */
function rangeStats(days){
  const t = todayISO();
  const st = days.map(statusOf);
  const met = st.filter(s => s === "met").length;
  const miss = st.filter(s => s === "miss").length;
  const closed = days.filter(d => d < t && dayEntries(d).length);
  const avg = closed.length ? closed.reduce((a,d)=>a+dayTotal(d),0)/closed.length : null;
  const total = days.reduce((a,d)=>a+dayTotal(d),0);
  return {met, miss, avg, total, registered: days.filter(d=>dayEntries(d).length).length};
}
function weekChart(days){
  const W = 340, H = 190, top = 22, bottom = 26, left = 6, right = 6;
  const totals = days.map(dayTotal);
  const goals = days.map(d => goalFor(d));
  const maxV = Math.max(1, ...totals, ...goals.map(g => g ? g.kcal*1.15 : 0));
  const slot = (W-left-right)/7, bw = slot*0.56;
  const y = v => top + (H-top-bottom) * (1 - v/maxV);
  const labels = ["L","M","M","J","V","S","D"];
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Calorías por día de la semana">`;
  for(let i=0;i<=3;i++){ const yy = top + (H-top-bottom)*i/3; s += `<line x1="${left}" x2="${W-right}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`; }
  days.forEach((d,i) => {
    const x = left + slot*i + (slot-bw)/2, v = totals[i], st = statusOf(d);
    const fill = st === "met" ? "var(--good)" : st === "miss" ? "var(--bad)" : st === "today" ? "var(--accent)" : "var(--idle)";
    if(v > 0){
      s += `<rect x="${x}" y="${y(v)}" width="${bw}" height="${H-bottom-y(v)}" rx="6" fill="${fill}"/>`;
      s += `<text x="${x+bw/2}" y="${y(v)-6}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink)" class="num">${n0(v)}</text>`;
    }
    if(goals[i]) s += `<line x1="${x-4}" x2="${x+bw+4}" y1="${y(goals[i].kcal)}" y2="${y(goals[i].kcal)}" stroke="var(--ink)" stroke-width="2" stroke-dasharray="4 3" opacity=".55"/>`;
    s += `<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="12" font-weight="700" fill="${d===todayISO()?"var(--accent)":"var(--muted)"}">${labels[i]}</text>`;
  });
  return s + `</svg>`;
}
function renderResumen(){
  const t = todayISO(), a = UI.sumAnchor, isWeek = UI.sumMode === "semana";
  let days = [], title = "", canNext;
  if(isWeek){
    const ws = weekStart(a); days = Array.from({length:7}, (_,i)=>addDays(ws,i));
    title = `${fmtShort(days[0])} – ${fmtShort(days[6])}`; canNext = days[6] < t;
  } else {
    const d = parse(a); const first = new Date(d.getFullYear(), d.getMonth(), 1);
    const n = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    days = Array.from({length:n}, (_,i)=>iso(new Date(first.getFullYear(), first.getMonth(), i+1)));
    title = monthName(a); title = title.charAt(0).toUpperCase() + title.slice(1); canNext = days[n-1] < t;
  }
  const r = rangeStats(days), evald = r.met + r.miss;
  let body;
  if(isWeek){
    body = `<section class="card stack"><h3 style="font-size:16px">Calorías por día</h3><div class="chart">${weekChart(days)}</div>
      <div class="legend"><span><i style="background:var(--good)"></i>Cumplido</span><span><i style="background:var(--bad)"></i>No cumplido</span><span><i style="background:var(--accent)"></i>Hoy</span><span>- - Meta</span></div></section>`;
  } else {
    const off = (parse(days[0]).getDay()+6)%7;
    const cells = Array.from({length:off}, ()=>`<div class="d blank" aria-hidden="true"></div>`).join("") + days.map(d => {
      const st = statusOf(d), v = dayTotal(d);
      return `<button class="d ${st}" data-go="${d}" aria-label="${esc(fmtLong(d))}: ${v ? n0(v)+" kcal" : "sin registro"}" ${st==="future"?"disabled":""}>${parse(d).getDate()}${v ? `<small class="num">${n0(v)}</small>` : ""}</button>`;
    }).join("");
    body = `<section class="card stack"><h3 style="font-size:16px">Calendario</h3>
      <div class="cal">${["L","M","M","J","V","S","D"].map(x=>`<div class="h">${x}</div>`).join("")}${cells}</div>
      <div class="legend"><span><i style="background:var(--good-soft);border:1px solid var(--good)"></i>Cumplido</span><span><i style="background:var(--bad-soft);border:1px solid var(--bad)"></i>No cumplido</span><span><i style="background:var(--idle)"></i>Sin registro</span></div>
      <p class="hint" style="margin:0">Toca un día para ver su detalle.</p></section>`;
  }
  // Lista de días con registro (detalle)
  const detail = days.filter(d => dayEntries(d).length).reverse().map(d => {
    const g = goalFor(d); const wd = parse(d).toLocaleDateString("es-CL",{weekday:"short", day:"numeric", month:"short"});
    return `<li><div class="grow stack" style="gap:4px"><div class="name">${esc(wd)}</div>${statusPill(d)}</div><div style="text-align:right"><div class="kc num">${n0(dayTotal(d))} kcal</div><div class="small muted num">meta ${g ? n0(g.kcal) : "—"}</div></div></li>`;
  }).join("");
  view.innerHTML = `
    <div class="seg" role="group" aria-label="Periodo">
      <button data-sm="semana" aria-pressed="${isWeek}">Semana</button><button data-sm="mes" aria-pressed="${!isWeek}">Mes</button>
    </div>
    <div class="datebar">
      <button class="iconbtn" id="prevR" aria-label="Periodo anterior">${ICON.left}</button>
      <div class="label">${esc(title)}</div>
      <button class="iconbtn" id="nextR" aria-label="Periodo siguiente" ${canNext ? "" : "disabled"}>${ICON.right}</button>
    </div>
    <section class="statgrid">
      <div class="tile"><div class="v num">${r.met}<span class="muted" style="font-size:15px">/${evald}</span></div><div class="k">Días cumplidos</div></div>
      <div class="tile"><div class="v num">${r.avg === null ? "—" : n0(r.avg)}</div><div class="k">Promedio kcal/día</div></div>
      <div class="tile"><div class="v num">${evald ? Math.round(100*r.met/evald) + "%" : "—"}</div><div class="k">Cumplimiento</div></div>
    </section>
    ${body}
    <section class="card"><h3 style="font-size:16px">Detalle</h3>${detail ? `<ul class="list">${detail}</ul>` : `<p class="empty">No hay registros en este periodo.</p>`}</section>
    <p class="hint" style="margin:0">El día de hoy no se cuenta en el cumplimiento hasta que termine. El promedio considera solo días cerrados con registro.</p>`;
  view.querySelectorAll("[data-sm]").forEach(b => b.onclick = () => { UI.sumMode = b.dataset.sm; render(); });
  $("#prevR").onclick = () => { UI.sumAnchor = isWeek ? addDays(weekStart(a),-7) : iso(new Date(parse(a).getFullYear(), parse(a).getMonth()-1, 1)); render(); };
  $("#nextR").onclick = () => { if(!canNext) return; UI.sumAnchor = isWeek ? addDays(weekStart(a),7) : iso(new Date(parse(a).getFullYear(), parse(a).getMonth()+1, 1)); render(); };
  view.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { UI.day = b.dataset.go; go("hoy"); });
}

        $("#aiKey").value = ""; $("#aiDel").disabled = false;
      }
    }finally{ btn.disabled = false; }
  };
  $("#aiDel").onclick = () => confirmSheet("Quitar clave", "La pestaña Con IA quedará desactivada hasta que pegues una clave de nuevo.", "Quitar", () => { setKey(""); render(); toast("Clave quitada"); });
  if(installEvt) $("#inst").onclick = async () => { installEvt.prompt(); try{ await installEvt.userChoice; }catch(e){} installEvt = null; render(); };
  const json = () => JSON.stringify(S, null, 1);
  $("#exp").onclick = () => {
    try{
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([json()], {type:"application/json"}));
      a.download = `dailyfuel-respaldo-${todayISO()}.json`; document.body.appendChild(a); a.click(); a.remove();
      toast("Respaldo descargado");
    }catch(e){ toast("No se pudo descargar. Usa Copiar respaldo."); }
  };
  $("#copy").onclick = async () => {
    try{ await navigator.clipboard.writeText(json()); toast("Respaldo copiado"); }
    catch(e){ toast("No se pudo copiar en este navegador"); }
  };
  $("#imp").onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    f.text().then(txt => {
      let d; try{ d = JSON.parse(txt); }catch(err){ toast("El archivo no es un respaldo válido"); return; }
      if(!d || !Array.isArray(d.entries) || !Array.isArray(d.products) || !Array.isArray(d.goals)){ toast("El archivo no es un respaldo de DailyFuel"); return; }
      confirmSheet("Restaurar respaldo", `Se reemplazarán tus datos actuales por ${d.entries.length} registros y ${d.products.length} productos.`, "Restaurar", () => {
        S = d; if(!Array.isArray(S.dishes)) S.dishes = []; save(); render(); toast("Respaldo restaurado");
      }, false);
    });
    e.target.value = "";
  };
  $("#wipe").onclick = () => confirmSheet("Borrar todo", "Se eliminarán tu meta, registros y productos de este teléfono. No se puede deshacer.", "Borrar todo", () => {
    S = blank(); save(); UI.day = todayISO(); go("hoy"); goalSheet(true);
  });
}

/* ---------- Navegación ---------- */
function render(){
  const g = goalFor(todayISO());
  $("#hdrGoal").textContent = g ? `Meta ${n0(g.kcal)} kcal` : "";
  document.querySelectorAll("nav.tabs [data-view]").forEach(b => b.setAttribute("aria-current", b.dataset.view === UI.view ? "page" : "false"));
  $("#fab").hidden = UI.view !== "hoy";
  ({hoy:renderHoy, productos:renderProductos, resumen:renderResumen, ajustes:renderAjustes})[UI.view]();
}
function go(v){ UI.view = v; window.scrollTo(0,0); render(); }
document.querySelectorAll("nav.tabs [data-view]").forEach(b => b.onclick = () => go(b.dataset.view));
$("#fab").onclick = () => { if(!goalFor(todayISO())){ goalSheet(true); return; } addSheet(); };
// Si el día cambia con la app abierta, avanzar a "hoy"
let lastToday = todayISO();
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && todayISO() !== lastToday){ if(UI.day === lastToday) UI.day = todayISO(); lastToday = todayISO(); render(); }
});

render();
if(!S.goals.length) goalSheet(true);

/* ---------- Modo offline (solo cuando está publicada en su propio sitio) ---------- */
try{
  if("serviceWorker" in navigator && location.protocol === "https:" && !location.hostname.endsWith("claude.ai") && !location.hostname.endsWith("claudeusercontent.com")){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
}catch(e){}
</script>
</body>
